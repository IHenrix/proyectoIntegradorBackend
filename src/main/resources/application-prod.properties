spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pasajeya}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:changeme}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

app.base-url=${APP_BASE_URL:https://api.pasajeya.com.pe}
app.frontend.url=${APP_FRONTEND_URL:https://pasajeya.com.pe}

# -- reCAPTCHA v2 (registrar claves reales en console.cloud.google.com) --
app.recaptcha.secret=${RECAPTCHA_SECRET}
app.recaptcha.site-key=${RECAPTCHA_SITE_KEY}
app.recaptcha.enabled=true

app.historial.capture-rate-ms=${HISTORIAL_CAPTURE_RATE_MS:21600000}
app.historial.initial-delay-ms=${HISTORIAL_INITIAL_DELAY_MS:600000}

app.twilio.enabled=${TWILIO_ENABLED:false}
app.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.twilio.from-whatsapp=${TWILIO_FROM_WHATSAPP:whatsapp:+14155238886}
