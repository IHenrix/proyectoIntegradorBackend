spring.application.name=pasaje-ya-backend

spring.profiles.active=dev

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

app.recaptcha.secret=${RECAPTCHA_SECRET}
app.recaptcha.site-key=${RECAPTCHA_SITE_KEY}
app.recaptcha.enabled=${RECAPTCHA_ENABLED:false}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.disable-swagger-default-url=true


app.historial.capture-rate-ms=21600000
app.historial.initial-delay-ms=600000
app.autorenovacion.rate-ms=3600000
app.autorenovacion.initial-delay-ms=60000

app.twilio.enabled=false
app.twilio.account-sid=
app.twilio.auth-token=
app.twilio.from-whatsapp=whatsapp:+14155238886

# Monitoreo (Spring Boot Actuator) — solo se exponen endpoints de solo
# lectura y sin datos sensibles (nunca env/beans/heapdump).
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

info.app.nombre=@project.name@
info.app.version=@project.version@
